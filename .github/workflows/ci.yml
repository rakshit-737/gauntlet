name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.8.4"
      - run: ruff check .
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # real-data tests auto-skip: datasets are never downloaded in this job
      - run: python -m pytest -q
      - name: smoke - CLI on shipped ATT&CK knowledge base
        run: |
          python -m gauntlet --version
          python -m gauntlet profiles
          python -m gauntlet plan --profile ransomware --top 10
          python -m gauntlet predict --observed T1566.001,T1059.001 -k 5
          python -m gauntlet sim --profile ransomware --json report.json
          python -m gauntlet sim --profile ransomware --baseline report.json
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "build==1.6.1" && python -m build
      - name: wheel smoke test in a clean venv outside the checkout
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp
          /tmp/v/bin/gauntlet --help
          /tmp/v/bin/gauntlet sim --profile ransomware --json r.json
          python -c "import json,sys; c=json.load(open('r.json'))['coverage']; print('coverage', c); sys.exit(c <= 0)"
      - name: sdist tests run
        run: |
          mkdir /tmp/s && tar -xzf dist/*.tar.gz -C /tmp/s
          cd /tmp/s/gauntlet_coverage-* && /tmp/v/bin/pip install pytest && /tmp/v/bin/python -m pytest -q
      - name: container build and smoke test
        run: |
          docker build -t gauntlet:ci .
          docker run --rm gauntlet:ci plan --profile ransomware --top 3
          docker run --rm gauntlet:ci sim --profile ransomware | tee sim.txt
          grep -q "Coverage: [1-9]" sim.txt
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: dependency audit
        run: pip install "pip-audit==2.10.1" && pip-audit -r requirements.txt -r requirements-docs.txt
      - name: secret scan (gitleaks, checksum-verified binary)
        run: |
          v=8.30.1
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt"
          grep "linux_x64.tar.gz" sums.txt | sed 's/  .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --no-banner --redact .
