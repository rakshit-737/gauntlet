[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet-coverage"
version = "1.1.1"
description = "Threat-informed purple-team coverage scoring: ATT&CK CTI prioritization, replay of real attack telemetry, Sigma detection scoring"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rakshit"}]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.8.4", "build"]
figures = ["matplotlib>=3.10.9"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.setuptools]
packages = ["gauntlet", "gauntlet.data", "gauntlet.data.rules"]
include-package-data = true

[tool.setuptools.package-data]
gauntlet = ["data/*.json", "data/rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["realdata: needs the downloaded datasets (GAUNTLET_DATA_DIR); skipped otherwise"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B023", "UP038", "UP042"]

[tool.ruff.lint.per-file-ignores]
"gauntlet/plans.py" = ["E501"]
"gauntlet/range_sim.py" = ["E501"]
