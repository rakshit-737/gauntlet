[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.2.0"
description = "Threat-informed purple-team coverage scoring: ATT&CK CTI prioritization, replay of real attack telemetry, Sigma detection scoring"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rakshit"}]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
figures = ["matplotlib>=3.8"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.setuptools]
packages = ["gauntlet"]

[tool.setuptools.package-data]
gauntlet = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["realdata: needs the downloaded datasets (GAUNTLET_DATA_DIR); skipped otherwise"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B023", "UP038"]

[tool.ruff.lint.per-file-ignores]
"gauntlet/plans.py" = ["E501"]
"gauntlet/range_sim.py" = ["E501"]
